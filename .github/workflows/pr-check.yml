name: Check proposed melody studio changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  browser-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tests/browser/video.mjs
      - run: node tests/browser/sequence.mjs
      - run: node tests/browser/image-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mp4-export-evidence
          path: .qa/
          retention-days: 30
          include-hidden-files: true
